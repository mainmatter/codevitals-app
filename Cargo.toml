[package]
name = "cv"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
gix = { version = "0.90", default-features = false, features = ["sha1", "blob-diff", "blocking-http-transport-reqwest-rust-tls", "parallel"] }
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "rustls", "rustls-ring", "jwt-rust-crypto", "retry", "timeout", "tracing"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Exact: a grammar decides facts, so upgrading one means raising `facts::EXTRACTOR`.
tree-sitter = "=0.27.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-rust = "=0.24.2"

# Crash by default: a panic anywhere, in any task, ends the process.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Parsers are C, compiled at their package's opt-level: unoptimized, tests parse slowly.
[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-c]
opt-level = 3

[profile.dev.package.tree-sitter-cpp]
opt-level = 3

[profile.dev.package.tree-sitter-rust]
opt-level = 3

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
